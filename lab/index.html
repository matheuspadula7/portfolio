<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab de Python | Matheus Padula</title>
<meta name="description" content="Laboratório pessoal para praticar os exercícios de Python do curso de Segurança da Informação.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0A0A0A; --bg-1:#111111; --bg-2:#161616;
  --accent:#ebbe38; --accent-soft:rgba(235,190,56,.12);
  --fg:#F5F5F0; --fg-dim:#8a8a82; --fg-mute:#55554f;
  --line:#1f1f1f; --line-2:#2a2a27;
  --ok:#6fcf8c; --err:#ff7a70;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg-0);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
code,pre,textarea,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
code{background:var(--bg-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;font-size:.88em;color:var(--accent)}
pre{background:var(--bg-1);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;margin:10px 0;overflow-x:auto;font-size:13px;line-height:1.6;color:var(--fg)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none}
.brand b{font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:22px;letter-spacing:-.02em;color:var(--accent)}
.brand span{font-size:12px;color:var(--fg-mute);font-family:'JetBrains Mono',monospace}
.status{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--fg-dim);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg-mute)}
.dot.on{background:var(--ok)}
.dot.load{background:var(--accent);animation:pulse 1s infinite}
.dot.off{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 66px)}
.side{border-right:1px solid var(--line);padding:20px 16px;overflow-y:auto;max-height:calc(100vh - 66px);position:sticky;top:0;align-self:start}
.mod-title{font-family:'Bricolage Grotesque',serif;font-size:20px;font-weight:600;letter-spacing:-.02em}
.mod-sub{font-size:12px;color:var(--fg-dim);margin:2px 0 12px}
.bar{height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.bar-txt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fg-mute);margin-bottom:18px}
.grupo{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-mute);margin:16px 0 6px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;color:var(--fg-dim)}
.item:hover{background:var(--bg-1);color:var(--fg)}
.item[aria-current="true"]{background:var(--accent-soft);border-color:var(--line-2);color:var(--fg)}
.chk{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--fg-mute);display:grid;place-items:center;font-size:10px;line-height:1;color:var(--bg-0)}
.item.feito .chk{background:var(--ok);border-color:var(--ok)}
.item.feito .chk::after{content:"✓"}
.tag{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--fg-mute)}

.main{padding:28px clamp(16px,3vw,40px) 60px;max-width:960px;width:100%}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
h1{font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.1;margin:6px 0 14px}
.enun{color:var(--fg);max-width:70ch}
.enun small{color:var(--fg-dim)}
.painel{margin-top:22px}
.rotulo{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
textarea{width:100%;min-height:230px;resize:vertical;background:var(--bg-1);color:var(--fg);border:1px solid var(--line-2);border-radius:var(--radius);padding:14px 16px;font-size:14px;line-height:1.65;tab-size:4;white-space:pre;overflow:auto}
textarea:focus-visible{outline-offset:0;border-color:var(--accent)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line-2);background:var(--bg-1);border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--fg-mute)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0A0A0A}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
.btn.sutil{background:none;color:var(--fg-dim)}
.saida{background:#050505;border:1px solid var(--line-2);border-radius:var(--radius);padding:14px 16px;min-height:72px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.saida.vazia{color:var(--fg-mute)}
.saida .erro{color:var(--err)}
.casos{list-style:none;margin-top:10px;display:grid;gap:8px}
.caso{border:1px solid var(--line-2);border-left-width:3px;border-radius:8px;padding:10px 14px;background:var(--bg-1);font-size:13.5px}
.caso.ok{border-left-color:var(--ok)}
.caso.falha{border-left-color:var(--err)}
.caso b{font-weight:600}
.caso .det{display:block;margin-top:4px;color:var(--fg-dim);font-size:12.5px}
.resumo{margin-top:10px;font-weight:600}
.resumo.ok{color:var(--ok)}
.resumo.falha{color:var(--err)}
.box{margin-top:14px;border:1px dashed var(--line-2);border-radius:var(--radius);padding:14px 16px;background:var(--bg-1)}
.box h3{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:8px;font-weight:500}
[hidden]{display:none!important}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.menu-btn{display:none}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .side.fechada .lista{display:none}
  .menu-btn{display:inline-block;margin-top:8px}
  .top{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){.dot.load{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/lab/"><b>Lab</b><span>python · segurança da informação</span></a>
  <div class="status" role="status" aria-live="polite"><span class="dot load" id="dot"></span><span id="status-txt">Carregando Python…</span></div>
</header>

<div class="layout">
  <nav class="side" id="side" aria-label="Exercícios">
    <div class="mod-title" id="mod-titulo"></div>
    <div class="mod-sub" id="mod-sub"></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="bar-txt" id="bar-txt"></div>
    <button class="btn sutil menu-btn" id="menu-btn" type="button" aria-expanded="true">Lista de exercícios</button>
    <div class="lista" id="lista"></div>
  </nav>

  <main class="main" id="main"></main>
</div>

<script src="exercicios.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="app.js"></script>
</body>
</html>
