<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #0a0a0a; color: #f5f5f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }

<body>
<div class="box">
  <p>Abrindo o WhatsApp...</p>
  <a id="go" href="https://wa.me/5512974054956" rel="noopener" data-no-lead>Abrir o WhatsApp agora</a>
</div>
<script>
(function () {
  var TARGET = 'https://wa.me/5512974054956';
  var q = new URLSearchParams(window.location.search);
  var extra = {};
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
    if (q.get(k)) { extra[k] = q.get(k); }
  });
  // Origem do clique (ex.: utm_campaign=destaque_contato) vira o link_location do lead.
  var origem = q.get('utm_campaign') || q.get('utm_source') || 'whatsapp-redirect';

  // Os UTMs ficam na URL desta página, então o GA4 já atribui a sessão à campanha no page_view.
  // Eles também seguem como parâmetros do lead, para conferir no DebugView.
  var params = {
    lead_method: 'whatsapp',
    link_location: origem,
    page_path: window.location.pathname,
    link_url: TARGET,
    transport_type: 'beacon'
  };
  for (var k in extra) { params[k] = extra[k]; }
  window.gtag('event', 'generate_lead', params);

  setTimeout(function () { window.location.replace(TARGET); }, 700);
})();
</script>
</body>
